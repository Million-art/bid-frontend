name: Frontend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bid-frontend
  SERVICE_NAME: carramarket-frontend
  CONTAINER_PORT: 3000
  HEALTH_ENDPOINT: /api/health

jobs:
  test:
    name: Test, Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: TypeCheck TypeScript
        run: npx tsc --noEmit

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.image-uri.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Target Image URI
        id: image-uri
        run: |
          echo "uri=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Frontend via Docker Compose
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_UI_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REGISTRY,REGISTRY_USER,REGISTRY_PASS,CLIENT_UI_TAG
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Starting Deployment for Frontend ($CLIENT_UI_TAG)"
            echo "=========================================================="

            # Authenticate with container registry
            echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

            cd /home/ubuntu/carramarket

            # Export tag and pull new image
            export CLIENT_UI_TAG="$CLIENT_UI_TAG"
            echo "⬇️ Pulling new frontend image..."
            docker compose pull frontend

            # Recreate frontend container
            echo "▶️ Updating frontend container..."
            docker compose up -d frontend

            # Quick status check
            sleep 3
            docker compose ps frontend

            # Clean up old unused images
            docker image prune -f --filter "until=24h"

            echo "=========================================================="
            echo "✨ Frontend deployed successfully via Docker Compose!"
            echo "=========================================================="
